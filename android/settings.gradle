pluginManagement {
    includeBuild(
        new File(
            providers.exec {
                commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require('path').resolve(process.cwd(), '..', 'node_modules', 'react-native')]})")
            }.standardOutput.asText.get().trim()
        ).parentFile.toString()
    )
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'LavatiScanner'
include ':app'
includeBuild(
    new File(
        providers.exec {
            commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require('path').resolve(process.cwd(), '..', 'node_modules', 'react-native')]})")
        }.standardOutput.asText.get().trim()
    ).parentFile.toString()
)
