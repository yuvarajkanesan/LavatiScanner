# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=1024m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
#
# arm64-v8a only (no armeabi-v7a, x86/x86_64 are emulator-only) - this both
# shrinks release APKs/AABs (see the abi splits in app/build.gradle) and
# speeds up every build, since native modules like reanimated no longer
# compile their C++ code for architectures nothing here ever runs on.
# armeabi-v7a is dropped specifically because its codegen build path (CMake/
# ninja, under New Architecture) exceeds Windows' 260-character MAX_PATH limit
# for this project - `bundleRelease` fails with a ninja "Filename longer than
# 260 characters" error on the gesture-handler codegen .cpp.o otherwise.
# arm64-v8a covers virtually every Android device sold since ~2017.
reactNativeArchitectures=arm64-v8a

# React Native 0.82+ forces the New Architecture on regardless of this flag (it's only
# kept for the handful of third-party modules in node_modules whose own build.gradle still
# gates `apply plugin: "com.facebook.react"` - and therefore their TurboModule codegen - on
# this literal property, e.g. react-native-nitro-modules). Must stay "true" so those
# modules' codegen actually runs and matches the architecture RN is really building for.
newArchEnabled=true

# @react-native-async-storage/async-storage registers its KSP (Room codegen)
# output via the `kotlin.sourceSets` DSL, which AGP 9's built-in Kotlin
# support rejects in favor of `android.sourceSets`. Suppress that check
# (AGP's own documented escape hatch) rather than patching the dependency.
android.disallowKotlinSourceSets=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Gradle's JDK toolchain auto-detection probes the Windows registry via
# native-platform to enumerate installed JDKs. On this machine that probe
# fails with "WindowsRegistry is not supported on this operating system"
# (a corrupted/mismatched native-platform resolution), which aborts
# configuration entirely. A JDK is already on PATH and running Gradle
# itself, so auto-detection isn't needed - disable it to skip the broken
# registry probe.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
